# Fuentes para construir el dataset combinado del equipo (python -m src.build_dataset).
#
# Por fuente:
#   kaggle:          dueño/dataset en Kaggle; se descarga solo y las rutas son relativas a él.
#   splits:          carpeta de cada split (train y/o test), o una lista de carpetas
#                    (p. ej. train + validation). Una fuente puede tener solo uno.
#   ruta:            en lugar de splits, para fuentes con una sola carpeta (como la del equipo):
#                    cada imagen va a test con probabilidad fraccion_test (por defecto 0.3).
#   nivel_clase:     en qué nivel bajo el split está la carpeta con el nombre de la clase
#                    (0 = split/clase/imagen.jpg; 1 = split/algo/clase/imagen.jpg).
#   ignorar:         carpetas a saltar en cualquier nivel (p. ej. productos empacados).
#   quitar_prefijos: texto a quitar del inicio del nombre ("freshapples" -> "apples").
#   renombrar:       nombre limpio -> nombre en data/mapping.csv, para casos especiales.
#   max_por_clase:   opcional, limita imágenes por clase de esa fuente.
#
# Las clases válidas son los alimentos de data/mapping.csv: cada carpeta se busca por su nombre en
# español o por los nombres_dataset de su fila, y en el dataset final queda con el nombre en español.
# Para agregar un alimento nuevo, primero se agrega su fila al CSV y luego su carpeta en las fotos
# del equipo.
#
# Las fuentes con `kaggle: dueño/dataset` se descargan solas con kagglehub (no hace falta Add Input)
# y sus rutas son relativas a la raíz de ese dataset. Si una ruta no existe tal cual, se busca una
# carpeta que termine igual (p. ej. dataset/dataset/Train). Para revisar la estructura:
#   python -m src.build_dataset --explorar <carpeta>

salida: /kaggle/working/dataset
tamano_max: 256   # lado mayor de las imágenes guardadas (no se agrandan las pequeñas)
seed: 42

fuentes:
  - nombre: fruits360
    kaggle: moltean/fruits
    splits:
      train: fruits-360_100x100/fruits-360/Training
      test: fruits-360_100x100/fruits-360/Test
    nivel_clase: 0
    renombrar:
      pepino: pepino dulce   # en Fruits-360 "Pepino" es el pepino dulce, no el pepino

  - nombre: freshrotten
    kaggle: swoyam2609/fresh-and-stale-classification
    splits:   # por confirmar con --explorar
      train: Train
      test: Test
    nivel_clase: 0
    quitar_prefijos: [fresh, rotten, stale]
    renombrar:   # en Test las carpetas vienen mal escritas (freshpatato, rottentamto)
      patato: potato
      tamto: tomato

  - nombre: packeat
    kaggle: sergeynesteruk/packed-fruits-and-vegetables-recognition-benchmark
    splits:   # el zip trae un nivel repetido: train/train/<clase>
      train: train/train
      test: test/test
    nivel_clase: 0
    max_por_clase: 1500   # PackEat es grande y dominado por manzana y tomate
    renombrar:   # PackEat agrupa brócoli y coliflor como "cabbage" y el chile como "pepper"
      cabbage broccoli: broccoli
      cabbage cauliflower: cauliflower
      pepper chili: chili

  - nombre: vegetales15   # Vegetable Image Dataset, 15 clases a 224x224
    kaggle: misrakahmed/vegetable-image-dataset
    splits:
      train:
        - Vegetable Images/train
        - Vegetable Images/validation
      test: Vegetable Images/test
    nivel_clase: 0

# Fuentes fuera de Kaggle, desactivadas por ahora: el dataset se arma solo con datasets
