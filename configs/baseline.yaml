# Rutas para Kaggle con el dataset Fruits-360 adjunto al notebook.
# El notebook las detecta solo; si corres en otro lado, ajústalas.
data:
  train_dirs:
    - /kaggle/input/datasets/moltean/fruits/fruits-360_100x100/fruits-360/Training
  test_dirs:
    - /kaggle/input/datasets/moltean/fruits/fruits-360_100x100/fruits-360/Test
  max_por_clase: 150        # imágenes por clase para entrenar (null = todas; más = más lento)
  max_por_clase_verdura: 180  # hay menos clases de verdura: más por clase para igualar a las frutas
  # Fruits-360 tiene ~15 imágenes de fruta por cada una de verdura. Con esto se entrena con
  # el mismo número de ambas (el de la etiqueta con menos imágenes, o max_por_etiqueta si es menor).
  balancear_etiquetas: true
  max_por_etiqueta: null
  # Versión preliminar: N frutas + N verduras de todo lo disponible, divididas por clase con
  # fraccion_test_muestra a test. null = usar train_dirs/test_dirs con los topes por clase.
  muestra_por_etiqueta: null
  fraccion_test_muestra: 0.2
  max_por_clase_test: null  # null = todo el conjunto de prueba
  # Limpieza al cargar el dataset combinado (no cambia el dataset de Kaggle). null = sin limpiar.
  # umbral_duplicado: quita fotos de Fruits-360 casi iguales a otra de su clase (bits de diferencia del hash).
  # tope_fruits360: máximo de fotos de Fruits-360 por clase. quitar_fondo_blanco: descarta fotos de estudio
  # de cualquier fuente (saca todo Fruits-360, que siempre tiene fondo blanco).
  limpieza:
    umbral_duplicado: 6
    tope_fruits360: 100
    quitar_fondo_blanco: false
  # Fotos del equipo: carpeta de Google Drive con una subcarpeta por alimento (fotos sueltas o zips).
  # El notebook la descarga y la pone en equipo_dir; ~30 % fijo a test, el resto a train.
  # En Kaggle, el enlace y los demás parámetros se cambian en la celda Parámetros del notebook.
  equipo_drive: https://drive.google.com/drive/folders/1l4Q_VRv__PdaO16_aKlgEwdX50k4FT3S   # carpeta, compartida como "cualquier persona con el enlace"
  equipo_dir: null
  fraccion_test_equipo: 0.3
  # Grupos de data/mapping.csv que se dejan fuera del entrenamiento y la prueba.
  # Para quitar nueces y semillas: excluir_grupos: [nueces_semillas]
  excluir_grupos: []
  # Peso extra por alimento: {alimento: n} da n veces más fotos a ese alimento al entrenar (si las tiene),
  # para las verduras de colores, que el modelo confunde con fruta. null = todos pesan igual.
  refuerzo: {betabel: 2, rabano: 2, zanahoria: 2, camote: 2, cebolla: 2, papa: 2, curcuma: 2, romanesco: 2,
             col: 2, radicchio: 2, nabo: 2, oca: 2, olluco: 2, mashua: 2, ruibarbo: 2, acelga: 2,
             flor_de_calabaza: 2, amaranto: 2, kale: 2, lechuga: 2, endibia: 2, rutabaga: 2}

features:
  tamano: 64                # la imagen se reduce a 64x64 antes de extraer
  # color, hog, lbp (los originales), color_espacial, hog_fino, lbp_multi, forma, color_lab, bovw;
  # quita alguno para comparar su aporte. bovw aprende su vocabulario de las fotos de train.
  tipos: [color, color_espacial, forma, color_lab, bovw]
  bins_color: 16
  # Separa el alimento del fondo antes de medir: grabcut (OpenCV), saturacion o null (imagen completa)
  segmentar: grabcut

cv:
  # anidada (5 vueltas por alimento para comparar modelos y 3 internas para elegir hiperparámetros),
  # uno_fuera_grupo (leave-one-out por alimento), grupos, estratificada o uno_fuera
  # (leave-one-out por imagen, solo para muestras chicas)
  tipo: anidada
  folds: 5                  # vueltas de grupos, estratificada, anidada (externas) y búsqueda de grid
  folds_internos: 3         # solo anidada

# Intervalo de confianza del 95 % en test remuestreando alimentos (repeticiones; 0 = no calcular)
bootstrap: 1000

seed: 42

# Busca con validación cruzada el umbral de probabilidad de verdura que mejor separa ambas
# etiquetas (accuracy balanceada) y lo guarda con el modelo. false = umbral 0.5.
ajustar_umbral: true

# Cómo se elige el modelo final: "vistos" = mayor f1_macro con fraccion_vistos de las fotos de cada
# alimento apartadas de train (fotos nuevas de alimentos vistos, como en la app); "cv" = mayor f1_macro
# de la validación cruzada (alimentos que el modelo no vio). La validación cruzada se reporta igual.
elegir_por: cv
fraccion_vistos: 0.2

# false = ignora los "grid" de los modelos y usa solo sus params fijos (más rápido)
ajustar_hiperparametros: true

# Modelos a comparar con validación cruzada. Se reentrena el mejor según elegir_por.
# Opciones: logistic_regression, svm, knn, naive_bayes, decision_tree, random_forest,
#           gradient_boosting, voting, stacking.
# "pca" reduce dimensiones antes del modelo (entero = componentes, decimal = varianza a conservar).
# "grid" activa GridSearchCV; las claves llevan el nombre del paso, p. ej.
# randomforestclassifier__max_depth o, para svm, calibratedclassifiercv__estimator__C.
models:
  - name: logistic_regression
    params: {C: 1.0}
  - name: knn
    params: {n_neighbors: 7}
    pca: 0.95
  - name: naive_bayes
  - name: random_forest
    params: {n_estimators: 300}
  - name: gradient_boosting
    params: {max_iter: 300, learning_rate: 0.1}
  - name: svm
    params: {kernel: rbf, C: 10, gamma: scale}
  # voting (svm + random_forest + gradient_boosting) quedó fuera: casi la mitad del tiempo y nunca ganó.
  # - name: voting
  #   params:
  #     estimadores:
  #       svm: {kernel: rbf, C: 10, gamma: scale}
  #       random_forest: {n_estimators: 300}
  #       gradient_boosting: {max_iter: 300}

output_dir: /kaggle/working/outputs
