# Rutas para Kaggle con el dataset Fruits-360 adjunto al notebook.
# El notebook las detecta solo; si corres en otro lado, ajústalas.
data:
  train_dirs:
    - /kaggle/input/datasets/moltean/fruits/fruits-360_100x100/fruits-360/Training
  test_dirs:
    - /kaggle/input/datasets/moltean/fruits/fruits-360_100x100/fruits-360/Test
  max_por_clase: 150        # imágenes por clase para entrenar (null = todas; más = más lento)
  # Fruits-360 tiene ~15 imágenes de fruta por cada una de verdura. Con esto se entrena con
  # el mismo número de ambas (el de la etiqueta con menos imágenes, o max_por_etiqueta si es menor).
  balancear_etiquetas: true
  max_por_etiqueta: null
  max_por_clase_test: null  # null = todo el conjunto de prueba
  # Fotos del equipo: carpeta de Google Drive con un zip por entrega (una subcarpeta por alimento).
  # El notebook la descarga y la pone en equipo_dir; ~30 % fijo a test, el resto a train.
  equipo_drive: https://drive.google.com/drive/folders/1l4Q_VRv__PdaO16_aKlgEwdX50k4FT3S   # carpeta, compartida como "cualquier persona con el enlace"
  equipo_dir: null
  fraccion_test_equipo: 0.3
  # Grupos de data/mapping.csv que se dejan fuera del entrenamiento y la prueba.
  # Para quitar nueces y semillas: excluir_grupos: [nueces_semillas]
  excluir_grupos: []

features:
  tamano: 64                # la imagen se reduce a 64x64 antes de extraer
  tipos: [color, hog, lbp]  # quita alguno para comparar su aporte
  bins_color: 16

cv:
  tipo: grupos              # grupos (recomendado) o estratificada
  folds: 5

seed: 42

# Busca con validación cruzada el umbral de probabilidad de verdura que mejor separa ambas
# etiquetas (accuracy balanceada) y lo guarda con el modelo. false = umbral 0.5.
ajustar_umbral: true

# Modelos a comparar con validación cruzada. Se reentrena el de mayor f1_macro.
# Opciones: logistic_regression, svm, knn, naive_bayes, decision_tree, random_forest,
#           gradient_boosting, voting, stacking.
# "pca" reduce dimensiones antes del modelo (entero = componentes, decimal = varianza a conservar).
# "grid" activa GridSearchCV; las claves llevan el nombre del paso, p. ej.
# randomforestclassifier__max_depth o, para svm, calibratedclassifiercv__estimator__C.
models:
  - name: logistic_regression
    params: {C: 1.0}
  - name: knn
    params: {n_neighbors: 7}
    pca: 0.95
  - name: naive_bayes
  - name: random_forest
    params: {n_estimators: 300}
  - name: gradient_boosting
    params: {max_iter: 300, learning_rate: 0.1}
  - name: svm
    params: {kernel: rbf, C: 10, gamma: scale}
  - name: voting
    params:
      estimadores:
        svm: {kernel: rbf, C: 10, gamma: scale}
        random_forest: {n_estimators: 300}
        gradient_boosting: {max_iter: 300}

output_dir: /kaggle/working/outputs
